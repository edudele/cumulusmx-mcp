name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: pip install ruff && ruff check .

  tests:
    name: tests (py${{ matrix.python }}, fastmcp ${{ matrix.fastmcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", fastmcp: "4.*" }
          - { python: "3.12", fastmcp: "3.*" }
          - { python: "3.12", fastmcp: "4.*" }
          - { python: "3.13", fastmcp: "4.*" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install "fastmcp==${{ matrix.fastmcp }}" ".[dev]"

      - name: Run tests
        env:
          MCP_AUTH_TOKEN: ci-test-token
        run: python -m pytest -q

  coverage:
    name: coverage (mínimo 90 %)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[dev]"

      - name: Run tests with coverage
        env:
          MCP_AUTH_TOKEN: ci-test-token
        run: |
          python -m pytest -q --cov --cov-fail-under=90 --cov-report=term --cov-report=xml --cov-report=markdown:coverage.md
          { echo "## Cobertura de tests"; echo; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: package build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/cumulusmx-mcp --version
          /tmp/clean/bin/python -c "import server, cumulusmx_mcp.tools.editors"

  docker-smoke:
    name: docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cumulusmx-mcp:ci .

      - name: Run and check
        run: |
          docker run -d --name mcp -p 8000:8000 \
            -e MCP_AUTH_TOKEN=ci-token -e MCP_AUTH_TOKEN_READONLY=ci-readonly \
            -e CUMULUSMX_URL=http://127.0.0.1:9 cumulusmx-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"healthy"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer wrong' http://127.0.0.1:8000/mcp)" = "401"
          docker exec mcp cumulusmx-mcp --version
          docker exec mcp sh -c 'touch /data/.write-test && rm /data/.write-test'
          docker logs mcp 2>&1 | tail -20

  docker-arm64:
    name: docker image smoke test (arm64, emulada)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 image
        run: docker buildx build --platform linux/arm64 --load -t cumulusmx-mcp:arm64 .

      - name: Run and check
        run: |
          test "$(docker image inspect cumulusmx-mcp:arm64 --format '{{.Architecture}}')" = "arm64"
          docker run -d --name mcp-arm -p 8001:8000 -e MCP_AUTH_TOKEN=ci-token -e CUMULUSMX_URL=http://127.0.0.1:9 \
            cumulusmx-mcp:arm64
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8001/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8001/health | grep -q '"status":"healthy"'
          docker exec mcp-arm cumulusmx-mcp --version
          docker logs mcp-arm 2>&1 | tail -20

  dependency-audit:
    name: dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt
