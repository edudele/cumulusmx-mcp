name: Publish to PyPI

# Publica el paquete (sdist + wheel) en PyPI con "trusted publishing" (OIDC): no hay ningún token guardado en GitHub.
# Se lanza con el tag vX.Y.Z (push del tag, o dispatch desde el workflow Release, porque los tags creados con
# GITHUB_TOKEN no disparan otros workflows). El paquete siempre se construye y comprueba; la subida solo ocurre si el
# repositorio tiene la variable de Actions PYPI_PUBLISH=true (Settings -> Secrets and variables -> Actions -> Variables),
# que se activa una vez configurado el publicador de confianza en PyPI (ver CONTRIBUTING.md).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches server version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cumulusmx_mcp/__init__.py)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ ($code_version) in cumulusmx_mcp/__init__.py" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cumulusmx-mcp
    permissions:
      id-token: write          # necesario para el trusted publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # volver a lanzar el workflow para la misma versión no falla
